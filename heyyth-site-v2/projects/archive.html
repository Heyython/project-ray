<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ARCHIVE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗃️</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --acc: #ffd166; --acc2: #ff8fc4; --bg: #0b0a12; --panel: #14121f; --panel2: #1b1829; --border: rgba(255,209,102,0.2); --text: #f2efe9; --dim: #9089a3; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Quicksand', sans-serif; }
  a.back { position: fixed; top: 1.2em; left: 1.2em; color: var(--dim); text-decoration: none; font-size: .8rem; border: 1px solid var(--border); padding: .5em 1em; border-radius: 999px; z-index: 20; background: var(--panel); }
  a.back:hover { color: var(--acc); border-color: var(--acc); }

  .wrap { max-width: 950px; margin: 0 auto; padding: 5em 1.5em 4em; }
  h1 { font-family: 'Poppins', sans-serif; font-size: 2rem; color: var(--acc); margin-bottom: 0; }
  .subtitle { color: var(--dim); font-size: .85rem; margin: .3em 0 2em; }

  .controls { display: flex; gap: .8em; flex-wrap: wrap; margin-bottom: 1.5em; }
  .search { flex: 1; min-width: 200px; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: .8em 1em; color: var(--text); outline: none; }
  .filter-chip { background: var(--panel); border: 1px solid var(--border); color: var(--dim); padding: .5em 1.1em; border-radius: 999px; font-size: .8rem; font-weight: 600; }
  .filter-chip.active { color: var(--bg); background: var(--acc); border-color: var(--acc); }

  .timeline { position: relative; padding-left: 1.6em; }
  .timeline::before { content: ""; position: absolute; left: 6px; top: 0; bottom: 0; width: 2px; background: var(--border); }

  .entry { position: relative; margin-bottom: 1em; }
  .entry::before { content: ""; position: absolute; left: -1.6em; top: 1.3em; width: 10px; height: 10px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 0 4px rgba(255,209,102,0.15); }
  .entry-card { background: var(--panel); border: 1px solid var(--border); border-radius: 14px; padding: 1.1em 1.3em; cursor: pointer; transition: border-color .2s; }
  .entry-card:hover { border-color: var(--acc); }
  .entry-top { display: flex; justify-content: space-between; align-items: center; gap: 1em; }
  .entry-title { font-weight: 700; font-family: 'Poppins', sans-serif; }
  .entry-date { font-size: .75rem; color: var(--dim); white-space: nowrap; }
  .entry-cat { display: inline-block; margin-top: .4em; font-size: .68rem; padding: .2em .7em; border-radius: 999px; background: rgba(255,143,196,0.15); color: var(--acc2); }
  .entry-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; }
  .entry-card.open .entry-body { max-height: 300px; margin-top: .8em; }
  .entry-notes { font-size: .88rem; color: var(--text); }
  .entry-img { width: 100%; max-width: 260px; border-radius: 10px; margin-top: .6em; display: block; }

  .empty-state { text-align: center; padding: 3em 1em; color: var(--dim); }
</style>
</head>
<body>
<a class="back" href="index.html">← back</a>

<div class="wrap">
  <h1>ARCHIVE</h1>
  <p class="subtitle">a personal database of things that may or may not matter</p>

  <div class="controls">
    <input type="text" class="search" id="search" placeholder="Search the archive..." />
  </div>
  <div class="controls" id="filters"></div>

  <div class="timeline" id="entries"></div>
</div>

<script>
(() => {
  const entries = [
    {
      title: "the first version of this site",
      date: "2025-11-02",
      category: "site history",
      notes: "it was one html file. it had a marquee tag. we do not talk about the marquee tag.",
    },
    {
      title: "the day the vault actually worked",
      date: "2026-01-14",
      category: "milestones",
      notes: "uploaded a file, it appeared in the folder, downloaded it, it was still the same file. groundbreaking stuff apparently.",
    },
    {
      title: "cyne prototype #1",
      date: "2026-02-20",
      category: "projects",
      notes: "originally just a black screen with green text that said 'access granted' no matter what you typed. upgraded since then.",
    },
    {
      title: "sonicflow's first tone",
      date: "2026-03-09",
      category: "projects",
      notes: "the first synthesized track sounded exactly like a smoke detector. many vibrato adjustments later, it's more listenable.",
    },
    {
      title: "the anon messages page got its first real message",
      date: "2026-04-01",
      category: "site history",
      notes: "it just said 'test'. incredible start to a feature.",
    },
    {
      title: "buildcore dashboard finished",
      date: "2026-05-18",
      category: "milestones",
      notes: "no actual builds happen here. it just looks like they do. that's the joke.",
    }
  ];

  let activeFilter = "all";
  let searchTerm = "";

  function categories() {
    return ["all", ...new Set(entries.map((e) => e.category))];
  }

  function renderFilters() {
    const el = document.getElementById("filters");
    el.innerHTML = "";
    categories().forEach((cat) => {
      const chip = document.createElement("button");
      chip.className = "filter-chip" + (cat === activeFilter ? " active" : "");
      chip.textContent = cat;
      chip.addEventListener("click", () => { activeFilter = cat; renderFilters(); renderEntries(); });
      el.appendChild(chip);
    });
  }

  function renderEntries() {
    const el = document.getElementById("entries");
    el.innerHTML = "";
    const filtered = entries
      .filter((e) => activeFilter === "all" || e.category === activeFilter)
      .filter((e) => (e.title + e.notes).toLowerCase().includes(searchTerm.toLowerCase()))
      .sort((a, b) => new Date(b.date) - new Date(a.date));

    if (!filtered.length) {
      el.innerHTML = `<div class="empty-state">nothing matches that. the archive stays quiet.</div>`;
      return;
    }

    filtered.forEach((entry) => {
      const wrap = document.createElement("div");
      wrap.className = "entry";
      const card = document.createElement("div");
      card.className = "entry-card";
      card.innerHTML = `
        <div class="entry-top">
          <span class="entry-title">${entry.title}</span>
          <span class="entry-date">${entry.date}</span>
        </div>
        <span class="entry-cat">${entry.category}</span>
        <div class="entry-body"><p class="entry-notes">${entry.notes}</p></div>`;
      card.addEventListener("click", () => card.classList.toggle("open"));
      wrap.appendChild(card);
      el.appendChild(wrap);
    });
  }

  document.getElementById("search").addEventListener("input", (e) => { searchTerm = e.target.value; renderEntries(); });

  renderFilters();
  renderEntries();
})();
</script>
</body>
</html>
