<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CYNE</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛰️</text></svg>" />
<style>
  :root { --acc: #00ffb2; --bg: #050807; --panel: #0b120f; --border: rgba(0,255,178,0.25); --text: #cdfff0; --dim: #5f9d8a; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; overflow-x: hidden; }
  a.back { position: fixed; top: 1.2em; left: 1.2em; color: var(--dim); text-decoration: none; font-size: .8rem; border: 1px solid var(--border); padding: .5em 1em; border-radius: 4px; z-index: 20; }
  a.back:hover { color: var(--acc); border-color: var(--acc); }

  .scanlines { position: fixed; inset: 0; pointer-events: none; z-index: 5; background: repeating-linear-gradient(0deg, rgba(0,255,178,0.025) 0px, rgba(0,255,178,0.025) 1px, transparent 1px, transparent 3px); }

  .wrap { max-width: 1000px; margin: 0 auto; padding: 5em 1.5em 4em; }
  h1 { font-size: 2rem; letter-spacing: 4px; color: var(--acc); text-shadow: 0 0 12px rgba(0,255,178,0.5); margin-bottom: .1em; }
  .subtitle { color: var(--dim); margin-bottom: 2em; font-size: .85rem; }

  .boot-log { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1.2em; height: 160px; overflow-y: auto; font-size: .8rem; margin-bottom: 2em; }
  .boot-log div { opacity: 0; animation: appear .15s forwards; margin-bottom: .2em; }
  @keyframes appear { to { opacity: 1; } }
  .boot-log .ok { color: var(--acc); }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.4em; margin-bottom: 2em; }
  @media (max-width: 800px) { .grid { grid-template-columns: 1fr; } }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1.2em; }
  .panel h2 { font-size: .85rem; letter-spacing: 2px; color: var(--acc); margin: 0 0 1em; text-transform: uppercase; }

  .status-row { display: flex; justify-content: space-between; font-size: .8rem; padding: .4em 0; border-bottom: 1px dashed var(--border); }
  .status-row:last-child { border-bottom: none; }
  .status-ok { color: var(--acc); }
  .status-warn { color: #ffd166; }

  .bar-track { height: 6px; background: rgba(255,255,255,0.05); border-radius: 3px; overflow: hidden; margin-top: .3em; }
  .bar-fill { height: 100%; background: var(--acc); border-radius: 3px; transition: width .6s ease; }

  #netviz { width: 100%; height: 180px; display: block; }

  .terminal { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 1em; }
  .term-output { height: 220px; overflow-y: auto; font-size: .82rem; margin-bottom: .8em; white-space: pre-wrap; }
  .term-output .line { margin-bottom: .3em; }
  .term-output .cmd { color: var(--acc); }
  .term-input-row { display: flex; align-items: center; gap: .5em; border-top: 1px solid var(--border); padding-top: .8em; }
  .term-input-row span { color: var(--acc); }
  .term-input-row input { flex: 1; background: none; border: none; color: var(--text); font-family: inherit; font-size: .85rem; outline: none; }

  .hint { font-size: .75rem; color: var(--dim); margin-top: .6em; }
</style>
</head>
<body>
<div class="scanlines"></div>
<a class="back" href="index.html">← back</a>

<div class="wrap">
  <h1>C Y N E</h1>
  <p class="subtitle">// experimental local security console — nothing here touches the real internet, promise</p>

  <div class="boot-log" id="boot-log"></div>

  <div class="grid">
    <div class="panel">
      <h2>System Status</h2>
      <div class="status-row"><span>Core process</span><span class="status-ok">RUNNING</span></div>
      <div class="status-row"><span>Firewall</span><span class="status-ok">ACTIVE</span></div>
      <div class="status-row"><span>Intrusion attempts (24h)</span><span id="intrusions" class="status-warn">0</span></div>
      <div class="status-row"><span>Uptime</span><span id="uptime">00:00:00</span></div>
      <div>
        <div class="status-row"><span>Load</span><span id="load-pct">0%</span></div>
        <div class="bar-track"><div class="bar-fill" id="load-bar" style="width:0%"></div></div>
      </div>
    </div>

    <div class="panel">
      <h2>Network Activity</h2>
      <canvas id="netviz"></canvas>
    </div>
  </div>

  <div class="panel" style="margin-bottom:2em;">
    <h2>Recent Logs</h2>
    <div id="logs" style="font-size:.8rem; max-height:140px; overflow-y:auto;"></div>
  </div>

  <div class="terminal">
    <h2>Console</h2>
    <div class="term-output" id="term-output"></div>
    <div class="term-input-row">
      <span>&gt;</span>
      <input type="text" id="term-input" placeholder="type 'help'" autocomplete="off" />
    </div>
    <p class="hint">try: help, status, scan, whoami, ping, clear, exit</p>
  </div>
</div>

<script>
(() => {
  // ---- boot sequence ----
  const bootLines = [
    "[ OK ] loading cyne core...",
    "[ OK ] initializing firewall rules...",
    "[ OK ] mounting local packet monitor (simulated)...",
    "[ OK ] loading threat signatures (0 real ones, this is fake)...",
    "[ OK ] handshake with localhost... success",
    "[ OK ] cyne ready."
  ];
  const bootLog = document.getElementById("boot-log");
  bootLines.forEach((line, i) => {
    const div = document.createElement("div");
    div.className = "ok";
    div.textContent = line;
    div.style.animationDelay = (i * 0.25) + "s";
    bootLog.appendChild(div);
  });

  // ---- fake stats ----
  const startTime = Date.now();
  setInterval(() => {
    const secs = Math.floor((Date.now() - startTime) / 1000);
    const h = String(Math.floor(secs / 3600)).padStart(2, "0");
    const m = String(Math.floor((secs % 3600) / 60)).padStart(2, "0");
    const s = String(secs % 60).padStart(2, "0");
    document.getElementById("uptime").textContent = `${h}:${m}:${s}`;
  }, 1000);

  function jitterLoad() {
    const pct = Math.round(15 + Math.random() * 40);
    document.getElementById("load-pct").textContent = pct + "%";
    document.getElementById("load-bar").style.width = pct + "%";
  }
  jitterLoad();
  setInterval(jitterLoad, 2200);

  let intrusions = 0;
  setInterval(() => {
    if (Math.random() < 0.3) {
      intrusions++;
      document.getElementById("intrusions").textContent = intrusions;
      addLog(`blocked suspicious ping from 10.0.${Math.floor(Math.random()*255)}.${Math.floor(Math.random()*255)} (not real, chill)`);
    }
  }, 3000);

  function addLog(text) {
    const logs = document.getElementById("logs");
    const row = document.createElement("div");
    const time = new Date().toLocaleTimeString();
    row.textContent = `[${time}] ${text}`;
    logs.prepend(row);
    while (logs.children.length > 30) logs.removeChild(logs.lastChild);
  }
  addLog("cyne initialized.");

  // ---- network visualization: simple pulsing node graph ----
  const canvas = document.getElementById("netviz");
  const ctx = canvas.getContext("2d");
  function resize() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
  window.addEventListener("resize", resize);
  resize();

  const nodes = Array.from({ length: 10 }, () => ({
    x: Math.random(), y: Math.random(), r: 2 + Math.random() * 2, phase: Math.random() * Math.PI * 2
  }));

  function draw() {
    const w = canvas.width, h = canvas.height;
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "rgba(0,255,178,0.15)";
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        const dist = Math.hypot((a.x - b.x) * w, (a.y - b.y) * h);
        if (dist < 140) {
          ctx.beginPath();
          ctx.moveTo(a.x * w, a.y * h);
          ctx.lineTo(b.x * w, b.y * h);
          ctx.stroke();
        }
      }
    }
    const t = Date.now() / 600;
    nodes.forEach((n) => {
      const pulse = 1 + Math.sin(t + n.phase) * 0.4;
      ctx.beginPath();
      ctx.fillStyle = "rgba(0,255,178,0.85)";
      ctx.arc(n.x * w, n.y * h, n.r * pulse, 0, Math.PI * 2);
      ctx.fill();
    });
    requestAnimationFrame(draw);
  }
  draw();

  // ---- terminal ----
  const output = document.getElementById("term-output");
  const input = document.getElementById("term-input");
  function printLine(text, isCmd) {
    const div = document.createElement("div");
    div.className = "line" + (isCmd ? " cmd" : "");
    div.textContent = text;
    output.appendChild(div);
    output.scrollTop = output.scrollHeight;
  }
  printLine("cyne console v0.4 — type 'help' to see what this does");

  const commands = {
    help: () => "commands: help, status, scan, whoami, ping, clear, exit",
    status: () => "all systems nominal. firewall active. threat level: mild curiosity.",
    scan: () => {
      addLog("manual scan triggered.");
      return "scanning local network... found 1 device (this one). no threats detected. shocking.";
    },
    whoami: () => "you are: someone who found the cybersecurity-looking project. hi.",
    ping: () => "pong. (that's it, that's the whole command)",
    clear: () => { output.innerHTML = ""; return null; },
    exit: () => { window.location.href = "index.html"; return "exiting..."; }
  };

  input.addEventListener("keydown", (e) => {
    if (e.key !== "Enter") return;
    const value = input.value.trim();
    if (!value) return;
    printLine("> " + value, true);
    input.value = "";
    const fn = commands[value.toLowerCase()];
    const result = fn ? fn() : `unknown command: "${value}". try 'help'.`;
    if (result) printLine(result);
  });
})();
</script>
</body>
</html>
