<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EXPERIMENTAL</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --acc: #c792ff; --acc2: #7c9bff; --bg: #0a0817; --panel: #14102a; --panel2: #1b1536; --border: rgba(199,146,255,0.22); --text: #f1ecff; --dim: #948aa8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); font-family: 'Quicksand', sans-serif; }
  a.back { position: fixed; top: 1.2em; left: 1.2em; color: var(--dim); text-decoration: none; font-size: .8rem; border: 1px solid var(--border); padding: .5em 1em; border-radius: 999px; z-index: 20; background: var(--panel); }
  a.back:hover { color: var(--acc); border-color: var(--acc); }

  .wrap { max-width: 1050px; margin: 0 auto; padding: 5em 1.5em 4em; }
  h1 { font-family: 'Poppins', sans-serif; font-size: 2rem; color: var(--acc); margin-bottom: 0; }
  .subtitle { color: var(--dim); font-size: .85rem; margin: .3em 0 2em; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.3em; }
  .toy { background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 1.3em; }
  .toy h2 { font-family: 'Poppins', sans-serif; font-size: 1rem; color: var(--acc2); margin: 0 0 .8em; }

  /* reaction game */
  .reaction-box { height: 130px; border-radius: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-weight: 700; background: var(--panel2); border: 1px solid var(--border); transition: background .15s; user-select: none; }
  .reaction-box.wait { background: #3a1b1b; color: #ff9d9d; }
  .reaction-box.go { background: #16351f; color: #7dffb0; }
  .reaction-result { margin-top: .6em; font-size: .85rem; color: var(--dim); text-align: center; }

  /* particles */
  canvas#particles { width: 100%; height: 180px; border-radius: 14px; background: var(--panel2); display: block; }
  .toy-hint { font-size: .75rem; color: var(--dim); margin-top: .5em; }

  /* random generator */
  .fortune-box { min-height: 70px; display: flex; align-items: center; justify-content: center; text-align: center; background: var(--panel2); border-radius: 14px; padding: 1em; font-style: italic; }
  .toy button.action { margin-top: .8em; background: linear-gradient(135deg, var(--acc), var(--acc2)); border: none; color: #0a0817; font-weight: 700; border-radius: 999px; padding: .6em 1.4em; }

  /* calculator */
  .calc-display { background: var(--panel2); border-radius: 10px; padding: .8em 1em; text-align: right; font-size: 1.3rem; margin-bottom: .6em; min-height: 1.6em; overflow-x: auto; }
  .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5em; }
  .calc-grid button { background: var(--panel2); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: .7em 0; font-size: 1rem; }
  .calc-grid button.op { color: var(--acc); }
  .calc-grid button.eq { background: linear-gradient(135deg, var(--acc), var(--acc2)); color: #0a0817; font-weight: 700; grid-column: span 2; }
  .calc-grid button:hover { border-color: var(--acc); }

  /* click counter utility */
  .counter-display { font-size: 2.4rem; font-weight: 700; text-align: center; color: var(--acc); margin-bottom: .6em; }
  .counter-row { display: flex; gap: .6em; justify-content: center; }

  /* gradient generator */
  .gradient-preview { height: 90px; border-radius: 14px; margin-bottom: .8em; transition: background .3s; }
</style>
</head>
<body>
<a class="back" href="index.html">← back</a>

<div class="wrap">
  <h1>EXPERIMENTAL</h1>
  <p class="subtitle">small broken toys that mostly work</p>

  <div class="grid">

    <div class="toy">
      <h2>⚡ Reaction Test</h2>
      <div class="reaction-box wait" id="reaction-box">wait for green...</div>
      <div class="reaction-result" id="reaction-result">click to start</div>
    </div>

    <div class="toy">
      <h2>✨ Particle Playground</h2>
      <canvas id="particles"></canvas>
      <p class="toy-hint">move your mouse over it</p>
    </div>

    <div class="toy">
      <h2>🔮 Random Generator</h2>
      <div class="fortune-box" id="fortune-box">click the button for wisdom</div>
      <button class="action" id="fortune-btn">Generate</button>
    </div>

    <div class="toy">
      <h2>🧮 Calculator</h2>
      <div class="calc-display" id="calc-display">0</div>
      <div class="calc-grid" id="calc-grid"></div>
    </div>

    <div class="toy">
      <h2>🖱️ Click Counter</h2>
      <div class="counter-display" id="counter-display">0</div>
      <div class="counter-row">
        <button class="action" id="counter-btn">+1</button>
        <button class="action" id="counter-reset" style="background:var(--panel2); color:var(--text);">reset</button>
      </div>
    </div>

    <div class="toy">
      <h2>🎨 Gradient Generator</h2>
      <div class="gradient-preview" id="gradient-preview"></div>
      <button class="action" id="gradient-btn">Randomize</button>
    </div>

  </div>
</div>

<script>
(() => {
  // ---- Reaction test ----
  const box = document.getElementById("reaction-box");
  const result = document.getElementById("reaction-result");
  let waitTimeout, goTime, state = "idle";
  function startReaction() {
    state = "waiting";
    box.className = "reaction-box wait";
    box.textContent = "wait for green...";
    result.textContent = "";
    const delay = 1000 + Math.random() * 2500;
    waitTimeout = setTimeout(() => {
      state = "go";
      goTime = performance.now();
      box.className = "reaction-box go";
      box.textContent = "CLICK NOW";
    }, delay);
  }
  box.addEventListener("click", () => {
    if (state === "idle") { startReaction(); return; }
    if (state === "waiting") {
      clearTimeout(waitTimeout);
      result.textContent = "too soon! try again.";
      state = "idle";
      box.className = "reaction-box wait";
      box.textContent = "click to start";
      return;
    }
    if (state === "go") {
      const rt = Math.round(performance.now() - goTime);
      result.textContent = `${rt}ms — ${rt < 250 ? "fast." : rt < 400 ? "decent." : "eh."} click to retry`;
      state = "idle";
      box.className = "reaction-box wait";
      box.textContent = "click to start";
    }
  });

  // ---- Particle playground ----
  const canvas = document.getElementById("particles");
  const ctx = canvas.getContext("2d");
  function resizeCanvas() { canvas.width = canvas.clientWidth; canvas.height = canvas.clientHeight; }
  window.addEventListener("resize", resizeCanvas);
  resizeCanvas();
  let particles = [];
  canvas.addEventListener("mousemove", (e) => {
    const rect = canvas.getBoundingClientRect();
    for (let i = 0; i < 2; i++) {
      particles.push({
        x: e.clientX - rect.left, y: e.clientY - rect.top,
        vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
        life: 1, hue: 280 + Math.random() * 60
      });
    }
  });
  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p) => {
      p.x += p.vx; p.y += p.vy; p.life -= 0.02;
      ctx.beginPath();
      ctx.fillStyle = `hsla(${p.hue}, 90%, 70%, ${Math.max(p.life,0)})`;
      ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
      ctx.fill();
    });
    particles = particles.filter((p) => p.life > 0);
    requestAnimationFrame(animateParticles);
  }
  animateParticles();

  // ---- Random generator ----
  const fortunes = [
    "you will click at least three more things on this website.",
    "today's forecast: mysterious with a chance of more hidden pages.",
    "the vault knows what you did.",
    "someone, somewhere, sent an anonymous message about you. probably not though.",
    "your next great idea will come to you at 2am, as tradition demands.",
    "this website has more pages than it should. you're welcome.",
    "you should probably close this tab and touch grass. but one more click first.",
    "cyne has been watching. cyne is not real. cyne says hi anyway."
  ];
  document.getElementById("fortune-btn").addEventListener("click", () => {
    const pick = fortunes[Math.floor(Math.random() * fortunes.length)];
    document.getElementById("fortune-box").textContent = pick;
  });

  // ---- Calculator ----
  const calcButtons = ["7","8","9","/","4","5","6","*","1","2","3","-","0",".","C","+","="];
  const calcGrid = document.getElementById("calc-grid");
  const display = document.getElementById("calc-display");
  let expr = "";
  calcButtons.forEach((label) => {
    const btn = document.createElement("button");
    btn.textContent = label;
    if ("+-*/".includes(label)) btn.classList.add("op");
    if (label === "=") btn.classList.add("eq");
    btn.addEventListener("click", () => {
      if (label === "C") { expr = ""; }
      else if (label === "=") {
        try {
          if (!/^[0-9+\-*/.\s]+$/.test(expr)) throw new Error();
          expr = String(Function(`"use strict"; return (${expr || 0})`)());
        } catch (e) { expr = "error"; }
      } else {
        expr = expr === "error" ? label : expr + label;
      }
      display.textContent = expr || "0";
    });
    calcGrid.appendChild(btn);
  });

  // ---- Click counter ----
  let count = 0;
  document.getElementById("counter-btn").addEventListener("click", () => {
    count++; document.getElementById("counter-display").textContent = count;
  });
  document.getElementById("counter-reset").addEventListener("click", () => {
    count = 0; document.getElementById("counter-display").textContent = count;
  });

  // ---- Gradient generator ----
  function randColor() {
    const h = Math.floor(Math.random() * 360);
    return `hsl(${h}, 80%, 65%)`;
  }
  function randomizeGradient() {
    const c1 = randColor(), c2 = randColor();
    const angle = Math.floor(Math.random() * 360);
    document.getElementById("gradient-preview").style.background = `linear-gradient(${angle}deg, ${c1}, ${c2})`;
  }
  document.getElementById("gradient-btn").addEventListener("click", randomizeGradient);
  randomizeGradient();
})();
</script>
</body>
</html>
