<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Socials</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>💌</text></svg>" />
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --acc: #ff8fc4; --acc2: #7c9bff; --bg: #0c0a17; --panel: #16122a; --border: rgba(255,143,196,0.2); --text: #f1ecff; --dim: #948aa8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: radial-gradient(circle at 50% 0%, #201636, var(--bg)); color: var(--text); font-family: 'Quicksand', sans-serif; }
  a.back { position: fixed; top: 1.2em; left: 1.2em; color: var(--dim); text-decoration: none; font-size: .8rem; border: 1px solid var(--border); padding: .5em 1em; border-radius: 999px; z-index: 20; background: var(--panel); }
  a.back:hover { color: var(--acc); border-color: var(--acc); }

  .wrap { max-width: 800px; margin: 0 auto; padding: 5em 1.5em 4em; text-align: center; }
  h1 { font-family: 'Poppins', sans-serif; font-size: 2rem; color: var(--acc); }
  .subtitle { color: var(--dim); font-size: .9rem; margin-bottom: 2.5em; }

  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 1.2em; text-align: left; }
  .social-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 18px; padding: 1.4em;
    display: flex; align-items: center; gap: 1em; text-decoration: none; color: var(--text);
    transition: transform .2s, border-color .2s, box-shadow .2s;
  }
  .social-card:hover { transform: translateY(-4px); border-color: var(--acc); box-shadow: 0 14px 34px rgba(0,0,0,0.35); }
  .social-icon {
    width: 46px; height: 46px; border-radius: 12px; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center; font-size: 1.3rem;
    background: linear-gradient(135deg, var(--acc), var(--acc2));
  }
  .social-info { min-width: 0; }
  .social-platform { font-size: .78rem; color: var(--dim); }
  .social-username { font-weight: 700; font-family: 'Poppins', sans-serif; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<a class="back" href="index.html">← back</a>

<div class="wrap">
  <h1>Socials</h1>
  <p class="subtitle">the normal part, I promise</p>
  <div class="cards" id="cards"></div>
</div>

<script src="../config/site.config.js"></script>
<script>
(() => {
  const config = window.SITE_CONFIG || { socials: [] };
  const icons = { instagram: "📸", snapchat: "👻", discord: "🎮", x: "𝕏" };
  const el = document.getElementById("cards");
  el.innerHTML = "";
  (config.socials || []).forEach((s) => {
    const card = document.createElement(s.url ? "a" : "div");
    card.className = "social-card";
    if (s.url) { card.href = s.url; card.target = "_blank"; card.rel = "noopener"; }
    card.innerHTML = `
      <div class="social-icon">${icons[s.icon] || "🔗"}</div>
      <div class="social-info">
        <div class="social-platform">${s.platform}</div>
        <div class="social-username">${s.username}</div>
      </div>`;
    el.appendChild(card);
  });
})();
</script>
</body>
</html>
